# «Пульс муниципалитетов»: все пути и параметры. Запуск: python -m pulse.run (из pulse/, PYTHONPATH=src;../common)
data_root: .                        # корень репозитория: данные в data/raw и data/ref (python scripts/download_data.py)
out: out
seed: 42

features: [beta, season, drift, mkt_speed, noise]   # атрибуты кластеризации (sync дублирует noise: rho = -0.90)
clip: 4.0                           # робастные z-оценки обрезаются на +-4

graphs:
  comove: {q: 99.9, k: 10}          # порог - 99.9 % квантиль нулевой модели (месяцы перемешаны), k сильнейших соседей
  road: {k: 8, d0_km: 100}
  attr: {k: 10}

grid:
  K: [4, 5, 6, 7, 8, 9]
  alpha: [0.3, 0.5, 0.7]            # вес атрибутов в совместной сети
  leiden_resolution: [0.3, 0.5, 0.7, 1.0, 1.5, 2.0]
  min_size: 20                      # меньшие группы присоединяются к соседней по сети

icvi:
  sample: 1200                      # подвыборка для силуэта и S_Dbw
  null_reps: 10
  stability_reps: 10
  stability_frac: 0.8

windows:                            # динамическая сеть: скользящие 12-месячные окна с шагом 3 месяца (в каждом один декабрь)
  "01.2023-12.2023": ["2023-01", "2023-12"]
  "04.2023-03.2024": ["2023-04", "2024-03"]
  "07.2023-06.2024": ["2023-07", "2024-06"]
  "10.2023-09.2024": ["2023-10", "2024-09"]
  "01.2024-12.2024": ["2024-01", "2024-12"]

forecasting_repo: null              # необязательно: путь к клону veshidar-dot/sberindex-2026 с посчитанными прогнозами (связь типа с ошибкой прогноза)
